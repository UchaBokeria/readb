<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>readb · devices</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div id="login" class="login">
      <form id="login-form" class="login-panel">
        <div class="wordmark">readb<span class="logo-cursor"></span></div>
        <h1>Your devices, connected.</h1>
        <p>Use the dashboard key from your server.</p>
        <label for="access-key">Access key</label
        ><input
          id="access-key"
          name="key"
          type="password"
          autocomplete="current-password"
          required
        /><button class="primary" type="submit">Connect</button>
        <p id="login-error" role="alert"></p>
        <small
          >The dashboard stays on your server. Devices use secure ADB.</small
        >
      </form>
    </div>
    <div id="app" class="app" hidden>
      <aside class="sidebar">
        <a class="wordmark" href="#devices" aria-label="readb home"
          >readb<span class="logo-cursor"></span
        ></a>
        <nav aria-label="Main navigation">
          <button data-page="devices" class="nav active">
            <span class="nav-icon">▣</span><span>Devices</span
            ><span id="device-count" class="count">0</span></button
          ><button data-page="actions" class="nav">
            <span class="nav-icon">⌘</span><span>Actions</span></button
          ><button data-page="activity" class="nav">
            <span class="nav-icon">≡</span><span>Activity</span></button
          ><button data-page="settings" class="nav">
            <span class="nav-icon">⚙</span><span>Settings</span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <div class="server-state">
            <i class="status-dot" id="server-dot"></i>
            <div>
              <strong>Server</strong><small id="server-state">Connecting</small>
            </div>
          </div>
          <button id="signout" class="subtle">Disconnect dashboard</button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            <span>Workspace</span><span>/</span
            ><strong id="page-label">Devices</strong>
          </div>
          <div class="topbar-end">
            <span id="last-updated" class="muted">Waiting for server</span
            ><button id="refresh" class="icon-button" aria-label="Refresh">
              ↻
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
        <footer class="workspace-foot">
          <span><i class="status-dot"></i> Secure ADB through your server</span
          ><span id="footer-meta">readb</span>
        </footer>
      </div>
    </div>
    <dialog id="action-dialog">
      <form id="action-form">
        <header>
          <div>
            <small id="action-class"></small>
            <h2 id="action-title"></h2>
          </div>
          <button
            class="icon-button"
            type="button"
            id="close-dialog"
            aria-label="Close"
          >
            ×
          </button>
        </header>
        <p id="action-description"></p>
        <div id="action-fields"></div>
        <div id="action-review" class="callout warning" hidden></div>
        <label id="review-row" class="check-row" hidden
          ><input type="checkbox" id="review-check" /><span
            >I reviewed the target and consequences.</span
          ></label
        >
        <div id="action-result" class="action-result" aria-live="polite"></div>
        <footer>
          <button type="button" class="secondary" id="cancel-action">
            Cancel</button
          ><button type="submit" class="primary" id="run-action">
            Run action
          </button>
        </footer>
      </form>
    </dialog>
    <div id="toast" role="status" class="toast" hidden></div>
  </body>
</html>
