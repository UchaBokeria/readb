[package]
name = "readb-android-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license-file = "../../LICENSE"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
readb-protocol = { path = "../protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
jni = "=0.22.4"
